name: nightly-simulation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  long-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sim:v1
      - run: pnpm sim:economy
      - uses: actions/upload-artifact@v4
        with:
          name: long-simulation
          path: |
            reports/combat-v1-100h.*
            reports/economy-v1-500h.*
          if-no-files-found: error
